# Publica o redirecionamento de www.kapota.com.br (Worker kapota-www, em tools/www) quando ele muda.
name: Publicar o www
on:
  push:
    branches: [main]
    paths:
      - "tools/www/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: tools/www
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar (ou só ensaiar, sem o token)
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Falta o segredo CLOUDFLARE_API_TOKEN (ou CLOUDFLARE_ACCOUNT_ID). Só ensaio, nada foi publicado."
            npx -y wrangler@4 deploy --dry-run --outdir /tmp/ensaio-www
          else
            npx -y wrangler@4 deploy
          fi
